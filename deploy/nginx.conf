# /etc/nginx/sites-available/estateiq -- symlink into sites-enabled.
# Replace your-domain.com and the /home/estateiq path with your actual values.

server {
    listen 80;
    server_name your-domain.com;

    location = /favicon.ico { access_log off; log_not_found off; }

    location /static/ {
        alias /home/estateiq/EstateIQ/staticfiles/;
        gzip on;
        gzip_types text/css application/javascript application/json image/svg+xml;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /home/estateiq/EstateIQ/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    client_max_body_size 10M;
}

# After the first successful `certbot --nginx -d your-domain.com` run, certbot rewrites this
# file to add a matching `listen 443 ssl;` server block and an http->https redirect here.
