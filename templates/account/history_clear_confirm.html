{% extends "base.html" %}

{% block title %}Clear History — {{ SITE_NAME }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-6 py-20">
  <p class="bp-label mb-3">Account</p>
  <h1 class="font-heading text-3xl font-semibold mb-6">Clear all prediction history?</h1>
  <p class="text-sm text-bp-muted mb-8">This permanently deletes every prediction you've made. This cannot be undone.</p>

  <div class="flex gap-3">
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="bp-btn-danger">Yes, Clear Everything</button>
    </form>
    <a href="{% url 'account:history' %}" class="bp-btn-ghost">Cancel</a>
  </div>
</div>
{% endblock %}
