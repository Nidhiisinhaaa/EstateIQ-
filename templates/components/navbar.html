<header class="sticky top-0 z-40 bg-bp-base/95 backdrop-blur border-b border-bp-line">
  <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
    <a href="{% url 'home' %}" class="flex items-center gap-2.5 group">
      <svg width="22" height="22" viewBox="0 0 22 22" fill="none" xmlns="http://www.w3.org/2000/svg" class="text-bp-accent">
        <circle cx="11" cy="11" r="9" stroke="currentColor" stroke-width="1.2"/>
        <line x1="11" y1="0" x2="11" y2="6" stroke="currentColor" stroke-width="1.2"/>
        <line x1="11" y1="16" x2="11" y2="22" stroke="currentColor" stroke-width="1.2"/>
        <line x1="0" y1="11" x2="6" y2="11" stroke="currentColor" stroke-width="1.2"/>
        <line x1="16" y1="11" x2="22" y2="11" stroke="currentColor" stroke-width="1.2"/>
        <circle cx="11" cy="11" r="1.4" fill="currentColor"/>
      </svg>
      <span class="font-heading font-semibold text-lg tracking-tight text-bp-text">EstateIQ</span>
    </a>

    <nav class="hidden md:flex items-center gap-1">
      <a href="{% url 'analytics:dashboard' %}" class="px-3.5 py-2 text-sm font-medium text-bp-muted hover:text-bp-accent transition-colors">Dashboard</a>
      <a href="{% url 'predictor:predict' %}" class="px-3.5 py-2 text-sm font-medium text-bp-muted hover:text-bp-accent transition-colors">Predict</a>
      <a href="{% url 'analytics:dashboard' %}" class="px-3.5 py-2 text-sm font-medium text-bp-muted hover:text-bp-accent transition-colors">Analytics</a>
      <a href="{% url 'predictor:model_report' %}" class="px-3.5 py-2 text-sm font-medium text-bp-muted hover:text-bp-accent transition-colors">Model Report</a>
      <a href="{% url 'analytics:map' %}" class="px-3.5 py-2 text-sm font-medium text-bp-muted hover:text-bp-accent transition-colors">Map</a>
    </nav>

    <div class="flex items-center gap-3">
      {% if request.user.is_authenticated %}
        <a href="{% url 'account:history' %}" class="hidden sm:inline-flex text-sm text-bp-muted hover:text-bp-accent transition-colors">History</a>
        <form method="post" action="{% url 'account:logout' %}" class="hidden sm:inline-flex">
          {% csrf_token %}
          <button type="submit" class="text-sm text-bp-muted hover:text-bp-accent transition-colors">Log Out</button>
        </form>
      {% else %}
        <a href="{% url 'account:login' %}" class="hidden sm:inline-flex text-sm text-bp-muted hover:text-bp-accent transition-colors">Log In</a>
      {% endif %}
      <a href="{% url 'predictor:predict' %}" class="bp-btn hidden sm:inline-flex">Predict Price</a>
    </div>
  </div>
</header>
