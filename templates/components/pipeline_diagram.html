{% comment %} Hand-coded inline SVG -- no diagramming library. {% endcomment %}
<svg viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="EstateIQ ML pipeline diagram" class="w-full h-auto">
  <defs>
    <marker id="pd-arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#D4AF37" />
    </marker>
  </defs>

  <g font-family="Inter, sans-serif" font-size="13" fill="#F5F5F5">

    <!-- Row 1: Raw Data -> Cleaning -> Feature Engineering -> EDA -> Split -->
    <g>
      <rect x="10" y="20" width="150" height="56" fill="#1C1C1C" stroke="#333333" />
      <text x="85" y="53" text-anchor="middle">Raw Data</text>
    </g>
    <g>
      <rect x="190" y="20" width="150" height="56" fill="#1C1C1C" stroke="#333333" />
      <text x="265" y="53" text-anchor="middle">Cleaning</text>
    </g>
    <g>
      <rect x="370" y="20" width="150" height="56" fill="#1C1C1C" stroke="#333333" />
      <text x="445" y="47" text-anchor="middle">Feature</text>
      <text x="445" y="63" text-anchor="middle">Engineering</text>
    </g>
    <g>
      <rect x="550" y="20" width="150" height="56" fill="#1C1C1C" stroke="#333333" />
      <text x="625" y="53" text-anchor="middle">EDA</text>
    </g>
    <g>
      <rect x="730" y="20" width="150" height="56" fill="#1C1C1C" stroke="#333333" />
      <text x="805" y="53" text-anchor="middle">Split</text>
    </g>

    <!-- Row 1 arrows, left to right -->
    <line x1="160" y1="48" x2="186" y2="48" stroke="#D4AF37" stroke-width="1.5" marker-end="url(#pd-arrow)" />
    <line x1="340" y1="48" x2="366" y2="48" stroke="#D4AF37" stroke-width="1.5" marker-end="url(#pd-arrow)" />
    <line x1="520" y1="48" x2="546" y2="48" stroke="#D4AF37" stroke-width="1.5" marker-end="url(#pd-arrow)" />
    <line x1="700" y1="48" x2="726" y2="48" stroke="#D4AF37" stroke-width="1.5" marker-end="url(#pd-arrow)" />

    <!-- Connector: Split (row 1, right) wraps down and left to Five Models (row 2, left) -->
    <path d="M 805 76 L 805 112 L 85 112" stroke="#D4AF37" stroke-width="1.5" fill="none" />
    <line x1="85" y1="112" x2="85" y2="156" stroke="#D4AF37" stroke-width="1.5" marker-end="url(#pd-arrow)" />

    <!-- Row 2: Five Models -> Evaluation -> Best Model -> Joblib -> Django -->
    <g>
      <rect x="10" y="160" width="150" height="56" fill="#1C1C1C" stroke="#333333" />
      <text x="85" y="184" text-anchor="middle">Five Models</text>
      <text x="85" y="200" text-anchor="middle" font-size="10" fill="#A3A3A3">LR / DT / RF / GB / XGB</text>
    </g>
    <g>
      <rect x="190" y="160" width="150" height="56" fill="#1C1C1C" stroke="#333333" />
      <text x="265" y="193" text-anchor="middle">Evaluation</text>
    </g>
    <g>
      <rect x="370" y="160" width="150" height="56" fill="#1C1C1C" stroke="#333333" />
      <text x="445" y="193" text-anchor="middle">Best Model</text>
    </g>
    <g>
      <rect x="550" y="160" width="150" height="56" fill="#1C1C1C" stroke="#333333" />
      <text x="625" y="193" text-anchor="middle">Joblib</text>
    </g>
    <g>
      <rect x="730" y="160" width="150" height="56" fill="#1C1C1C" stroke="#D4AF37" stroke-width="2" />
      <text x="805" y="193" text-anchor="middle" fill="#D4AF37" font-weight="600">Django</text>
    </g>

    <!-- Row 2 arrows, left to right -->
    <line x1="160" y1="188" x2="186" y2="188" stroke="#D4AF37" stroke-width="1.5" marker-end="url(#pd-arrow)" />
    <line x1="340" y1="188" x2="366" y2="188" stroke="#D4AF37" stroke-width="1.5" marker-end="url(#pd-arrow)" />
    <line x1="520" y1="188" x2="546" y2="188" stroke="#D4AF37" stroke-width="1.5" marker-end="url(#pd-arrow)" />
    <line x1="700" y1="188" x2="726" y2="188" stroke="#D4AF37" stroke-width="1.5" marker-end="url(#pd-arrow)" />
  </g>
</svg>
