{% extends "base.html" %}

{% block title %}Log In — {{ SITE_NAME }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-6 py-20">
  <p class="bp-label mb-3">Account</p>
  <h1 class="font-heading text-3xl font-semibold mb-8">Log In</h1>

  {% if form.errors %}
    <div class="bp-card border-bp-down p-4 mb-6 text-sm">Incorrect username or password.</div>
  {% endif %}

  <form method="post" class="bp-card bp-tick p-6 space-y-5">
    {% csrf_token %}
    <div>
      <label class="bp-label block mb-2" for="{{ form.username.id_for_label }}">Username</label>
      <input type="text" name="username" class="bp-input" id="{{ form.username.id_for_label }}" required autofocus>
    </div>
    <div>
      <label class="bp-label block mb-2" for="{{ form.password.id_for_label }}">Password</label>
      <input type="password" name="password" class="bp-input" id="{{ form.password.id_for_label }}" required>
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="bp-btn w-full">Log In</button>
  </form>

  <p class="text-sm text-bp-muted mt-6">
    No account yet? <a href="{% url 'account:signup' %}" class="text-bp-accent">Sign up</a>
  </p>
</div>
{% endblock %}
