{% extends "base.html" %}

{% block title %}Change Password — {{ SITE_NAME }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-6 py-20">
  <p class="bp-label mb-3">Account</p>
  <h1 class="font-heading text-3xl font-semibold mb-8">Change Password</h1>

  <form method="post" class="bp-card bp-tick p-6 space-y-5">
    {% csrf_token %}
    {% for field in form %}
      <div>
        <label class="bp-label block mb-2" for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% for error in field.errors %}<p class="text-bp-down text-xs mt-1">{{ error }}</p>{% endfor %}
      </div>
    {% endfor %}
    <button type="submit" class="bp-btn w-full">Update Password</button>
  </form>
</div>
{% endblock %}
